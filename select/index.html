<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose a view of Siyuan Gong's personal website.">
    <title>Siyuan Gong | Choose Your View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="icon" href="../favicon_logosc/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --ink: #183329;
            --paper: #f4fbf8;
            --white: #fff;
            --green: #00874e;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: 'DM Mono', monospace;
        }

        main {
            width: min(1120px, calc(100% - 48px));
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(54px, 10vh, 100px) 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        header {
            padding-bottom: clamp(28px, 5vh, 48px);
            border-bottom: 2px solid var(--ink);
        }

        h1 {
            margin: 0;
            font-family: 'Fraunces', serif;
            font-size: clamp(3.2rem, 7vw, 6.3rem);
            line-height: 0.95;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 18px 0 0;
            color: var(--green);
            font-size: clamp(1.12rem, 1.8vw, 1.3rem);
            font-weight: 500;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-bottom: 2px solid var(--ink);
        }

        .choice {
            min-height: 320px;
            padding: clamp(30px, 4vw, 52px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: inherit;
            text-decoration: none;
            transition: color 180ms ease, background 180ms ease;
        }

        .choice + .choice { border-left: 2px solid var(--ink); }
        .choice:hover, .choice:focus-visible { color: var(--white); background: var(--ink); outline: 0; }
        .choice:hover .number, .choice:focus-visible .number { color: #6ee7a8; }
        .choice:hover .arrow, .choice:focus-visible .arrow { transform: translateX(8px); }

        .number { color: var(--green); font-size: 0.86rem; font-weight: 500; }
        h2 { margin: 50px 0 12px; font-family: 'Fraunces', serif; font-size: clamp(2rem, 3.2vw, 3.2rem); letter-spacing: 0; }
        .description { max-width: 460px; margin: 0; line-height: 1.6; font-size: 1.12rem; }
        .action { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; font-size: 1.14rem; font-weight: 500; }
        .arrow { font-size: 1.7rem; transition: transform 180ms ease; }

        @media (max-width: 680px) {
            main { width: min(100% - 24px, 520px); padding: 40px 0; justify-content: flex-start; }
            .choices { grid-template-columns: 1fr; }
            .choice { min-height: 245px; padding: 28px 24px; }
            .choice + .choice { border-left: 0; border-top: 2px solid var(--ink); }
            h2 { margin-top: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Meet Siyuan</h1>
            <p class="subtitle">Choose your preferred view</p>
        </header>

        <section class="choices" aria-label="Website views">
            <a class="choice" href="../classic/">
                <div>
                    <span class="number">01 / CLASSIC</span>
                    <h2>Classic Mode</h2>
                    <p class="description">A traditional academic profile of Siyuan's research, projects, and experience.</p>
                </div>
                <div class="action"><span>Open classic view</span><span class="arrow" aria-hidden="true">→</span></div>
            </a>

            <a class="choice" href="../terminal/">
                <div>
                    <span class="number">02 / TERMINAL</span>
                    <h2>Terminal Mode</h2>
                    <p class="description">A command-line window for interacting with the Goosy CLI.</p>
                </div>
                <div class="action"><span>Launch terminal</span><span class="arrow" aria-hidden="true">→</span></div>
            </a>
        </section>
    </main>
</body>
</html>
